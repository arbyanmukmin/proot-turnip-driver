name: Build Mesa with Turnip driver for ARM64 and ARMHF

on:
  workflow_dispatch:
    inputs:
      mesa-version:
        description: 'Mesa version to build (e.g., 24.3.4)'
        required: false
        default: '24.3.4'
      use-patches:
        description: 'Apply patches from /patches folder'
        required: false
        default: false

env:
  MESA_VERSION: ${{ github.event.inputs.mesa-version || '24.3.4' }}
  USE_PATCHES: ${{ github.event.inputs.use-patches || 'false' }}

jobs:
  build-turnip:
    # ARM64 and ARMHF build in parallel — cuts wall time roughly in half.
    strategy:
      matrix:
        include:
          - arch: arm64
            triple: aarch64-linux-gnu
          - arch: armhf
            triple: arm-linux-gnueabihf

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.3

      - name: Configure APT sources
        run: |
          sudo dpkg --add-architecture ${{ matrix.arch }}
          CODENAME=plucky
          sudo rm -f /etc/apt/sources.list
          sudo rm -rf /etc/apt/sources.list.d/*
          cat << EOF | sudo tee /etc/apt/sources.list
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu $CODENAME main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu $CODENAME-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu $CODENAME-security main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu $CODENAME-backports main restricted universe multiverse
          EOF
          cat << EOF | sudo tee /etc/apt/sources.list.d/cross-compile.list
          deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ $CODENAME main restricted universe multiverse
          deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ $CODENAME-updates main restricted universe multiverse
          EOF
          sudo apt-get update -q

      # Reuse downloaded .deb files across runs. Key on workflow file contents so
      # it invalidates automatically when the package list changes.
      - name: Cache APT packages
        uses: actions/cache@v5.0.5
        with:
          path: /var/cache/apt/archives
          key: apt-${{ matrix.arch }}-${{ hashFiles('.github/workflows/build-turnip.yml') }}
          restore-keys: apt-${{ matrix.arch }}-

      # Reuse the Mesa tarball across both jobs and across re-runs of the same version.
      # Both matrix jobs share this key since it is arch-independent source.
      - name: Cache Mesa source tarball
        uses: actions/cache@v5.0.5
        with:
          path: ~/mesa-${{ env.MESA_VERSION }}/mesa-mesa-${{ env.MESA_VERSION }}.tar.gz
          key: mesa-tarball-${{ env.MESA_VERSION }}

      # ccache stores compiled object files keyed on source + flags.
      # First run primes the cache; subsequent runs on the same Mesa version
      # skip the bulk of compilation entirely.
      - name: Cache ccache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.ccache
          # Save a new entry each run so the cache grows incrementally.
          # Restore from the most recent run for this arch+version pair.
          key: ccache-${{ matrix.arch }}-${{ env.MESA_VERSION }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.arch }}-${{ env.MESA_VERSION }}-
            ccache-${{ matrix.arch }}-

      - name: Install build tools and cross-compile dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            ccache meson python3-pip flex bison python3-mako glslang-tools \
            python-is-python3 \
            g++-${{ matrix.triple }} gcc-${{ matrix.triple }} \
            pkg-config:${{ matrix.arch }} \
            zlib1g-dev:${{ matrix.arch }} \
            libexpat1-dev:${{ matrix.arch }} \
            libdrm-dev:${{ matrix.arch }} \
            libx11-dev:${{ matrix.arch }} \
            libx11-xcb-dev:${{ matrix.arch }} \
            libxext-dev:${{ matrix.arch }} \
            libxdamage-dev:${{ matrix.arch }} \
            libxcb-glx0-dev:${{ matrix.arch }} \
            libxcb-dri2-0-dev:${{ matrix.arch }} \
            libxcb-dri3-dev:${{ matrix.arch }} \
            libxcb-shm0-dev:${{ matrix.arch }} \
            libxcb-present-dev:${{ matrix.arch }} \
            libxshmfence-dev:${{ matrix.arch }} \
            libxxf86vm-dev:${{ matrix.arch }} \
            libxrandr-dev:${{ matrix.arch }} \
            libglvnd-dev:${{ matrix.arch }} \
            libwayland-dev:${{ matrix.arch }} \
            wayland-protocols:${{ matrix.arch }} \
            libwayland-egl-backend-dev:${{ matrix.arch }}

      - name: Build Mesa with Turnip
        env:
          # ccache defaults to ~/.ccache; set size ceiling here so the
          # cache step above and the build step agree on the directory.
          CCACHE_MAXSIZE: 2G
        run: |
          echo "Building Mesa $MESA_VERSION for ${{ matrix.arch }}"
          chmod +x build_turnip.sh
          bash build_turnip.sh "$MESA_VERSION" "${{ matrix.arch }}"

      # Visible in the Actions log — useful for confirming the cache is actually
      # being hit and for tuning CCACHE_MAXSIZE if needed.
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mesa-turnip-${{ env.MESA_VERSION }}-${{ matrix.arch }}
          path: ~/mesa-build/mesa-vulkan-kgsl_${{ env.MESA_VERSION }}-*-${{ matrix.arch }}.deb
